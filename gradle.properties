# Настройки Gradle — производительность и память
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:+UseStringDeduplication -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Настройки Kotlin
kotlin.code.style=official

# Настройки IntelliJ Platform Plugin
# Версия плагина
pluginVersion=2.8.1

# Версия IDE
platformVersion=2023.1.5


# Стандартная библиотека Kotlin уже поставляется IDE.
kotlin.stdlib.default.dependency=false
